<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX S44 Analytics Suite</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a; color: #e0e0e0;
            min-height: 100vh; padding: 40px;
        }
        h1 {
            text-align: center; font-size: 2em; margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center; color: #888; margin-bottom: 40px; font-size: 0.95em;
        }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px; max-width: 1200px; margin: 0 auto;
        }
        .card {
            background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px;
            padding: 24px; transition: all 0.3s; cursor: pointer;
            text-decoration: none; color: inherit; display: block;
        }
        .card:hover {
            border-color: #7b2ff7; transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(123, 47, 247, 0.15);
        }
        .card h2 { font-size: 1.15em; margin-bottom: 8px; color: #00d4ff; }
        .card p { font-size: 0.9em; color: #999; line-height: 1.5; }
        .card .path {
            margin-top: 12px; font-family: monospace; font-size: 0.8em;
            color: #7b2ff7; background: #0f0f1f; padding: 4px 8px;
            border-radius: 4px; display: inline-block;
        }
    </style>
</head>
<body>
    <h1>APEX S44 Analytics Suite</h1>
    <p class="subtitle">European Credit Analytical Tools</p>
    <div class="grid">
        {% for tool in tools %}
        <a class="card" href="{{ tool.path }}">
            <h2>{{ tool.name }}</h2>
            <p>{{ tool.desc }}</p>
            <span class="path">{{ tool.path }}</span>
        </a>
        {% endfor %}
    </div>
</body>
</html>
