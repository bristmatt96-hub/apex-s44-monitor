<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tranche Lab | Macro Credit Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg-base:#0a0e17; --bg-card:#111827; --bg-card-alt:#151d2e; --bg-hover:#1a2436;
            --border:#1e293b; --border-dim:rgba(30,41,59,0.5);
            --text-primary:#f1f5f9; --text-secondary:#94a3b8; --text-muted:#64748b; --text-dim:#475569;
            --accent-green:#22c55e; --accent-red:#ef4444; --accent-amber:#f59e0b;
            --accent-blue:#3b82f6; --accent-teal:#14b8a6; --accent-purple:#a78bfa;
            --green-bg:rgba(34,197,94,0.10); --green-bdr:rgba(34,197,94,0.25);
            --red-bg:rgba(239,68,68,0.10); --red-bdr:rgba(239,68,68,0.25);
            --amber-bg:rgba(245,158,11,0.10); --amber-bdr:rgba(245,158,11,0.25);
            --blue-bg:rgba(59,130,246,0.10); --blue-bdr:rgba(59,130,246,0.25);
            --font-sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            --font-mono:'JetBrains Mono','Fira Code','SF Mono',monospace;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{-webkit-font-smoothing:antialiased}
        body{background:var(--bg-base);color:var(--text-primary);font-family:var(--font-sans);font-size:13px;line-height:1.5;min-height:100vh}
        ::-webkit-scrollbar{width:5px;height:5px}
        ::-webkit-scrollbar-track{background:var(--bg-base)}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

        .header{background:var(--bg-card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;padding:10px 24px;display:flex;align-items:center;justify-content:space-between}
        .brand{display:flex;align-items:center;gap:12px}
        .brand h1{font-size:17px;font-weight:700;letter-spacing:-0.3px}
        .brand em{color:var(--accent-blue);font-style:normal}
        .brand .sep{color:var(--text-dim);font-weight:300}
        .brand .sub{color:var(--accent-purple);font-size:12px;font-weight:600}
        .nav-links{display:flex;gap:8px}
        .nav-link{font-size:10px;font-family:var(--font-mono);padding:4px 10px;border-radius:4px;color:var(--text-muted);text-decoration:none;border:1px solid var(--border);transition:all .15s}
        .nav-link:hover{color:var(--text-primary);border-color:var(--accent-blue);background:var(--blue-bg)}

        .main{max-width:1700px;margin:0 auto;padding:20px}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        @media(max-width:1200px){.grid-2{grid-template-columns:1fr}}

        .card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
        .card-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
        .card-hdr h2{font-size:13px;font-weight:600;letter-spacing:-0.2px}
        .card-hdr .sub{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
        .card-body{padding:14px 16px}

        .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;font-family:var(--font-mono)}
        .badge-blue{background:var(--blue-bg);color:var(--accent-blue);border:1px solid var(--blue-bdr)}
        .badge-purple{background:rgba(167,139,250,0.10);color:var(--accent-purple);border:1px solid rgba(167,139,250,0.25)}

        .calib-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
        .calib-box{background:var(--bg-base);border-radius:6px;padding:10px 12px}
        .calib-box .lbl{font-size:9px;font-weight:500;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;font-family:var(--font-mono);margin-bottom:3px}
        .calib-box .tranche-name{font-size:11px;font-weight:600;color:var(--text-primary);margin-bottom:6px}
        .calib-box .metric{display:flex;justify-content:space-between;padding:2px 0;font-size:11px}
        .calib-box .metric .k{color:var(--text-muted)}
        .calib-box .metric .v{color:var(--text-primary);font-family:var(--font-mono);font-weight:500}

        table{width:100%;border-collapse:collapse}
        th{text-align:left;padding:8px 10px;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);border-bottom:1px solid var(--border);font-family:var(--font-mono)}
        td{padding:7px 10px;font-size:12px;border-bottom:1px solid var(--border-dim);font-family:var(--font-mono)}
        tr:hover td{background:var(--bg-hover)}
        .tar{text-align:right}
        .tac{text-align:center}

        .pnl-pos{color:var(--accent-green);font-weight:600}
        .pnl-neg{color:var(--accent-red);font-weight:600}
        .pnl-zero{color:var(--text-muted)}
        .pnl-cell{font-size:11px}

        .bump-tight{color:var(--accent-green);font-weight:500}
        .bump-wide{color:var(--accent-red);font-weight:500}
        .bump-base{color:var(--accent-amber);font-weight:500}

        .footer{border-top:1px solid var(--border);margin-top:20px;padding:10px 0}
        .footer .inner{max-width:1700px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);font-family:var(--font-mono)}

        .loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text-muted)}
        .spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent-blue);border-radius:50%;animation:spin .8s linear infinite;margin-right:10px}
        @keyframes spin{to{transform:rotate(360deg)}}

        .mono{font-family:var(--font-mono)}
        .tw{color:var(--text-primary)}.ts{color:var(--text-secondary)}.tm{color:var(--text-muted)}.td{color:var(--text-dim)}
        .tg{color:var(--accent-green)}.tr{color:var(--accent-red)}.ta{color:var(--accent-amber)}.tb{color:var(--accent-blue)}.tp{color:var(--accent-purple)}
        .fb{font-weight:700}.fm{font-weight:500}
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const fmt = (n, dp=0) => n != null ? Number(n).toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp}) : '--';
const fmtK = n => {
    if(n==null||n==='') return '--';
    const v = Math.round(Number(n)/1000);
    const prefix = v > 0 ? '+' : v < 0 ? '' : '';
    return prefix + '\u20AC' + fmt(v) + 'k';
};
const pnlCls = n => { const v=Number(n); return v>0?'pnl-pos':v<0?'pnl-neg':'pnl-zero'; };

function IndexCard({ title, subtitle, badge, tranches }) {
    if (!tranches || tranches.length === 0) return null;

    // Extract scenario bump column names
    const allKeys = Object.keys(tranches[0]);
    const pnlKeys = allKeys.filter(k => k.startsWith('PnL_'));

    // Parse bump labels from column names like "PnL_-50bp_(200)"
    const bumps = pnlKeys.map(k => {
        const match = k.match(/PnL_([+-]?\d+)bp/);
        return { key: k, label: match ? match[1] + 'bp' : k, value: match ? parseInt(match[1]) : 0 };
    });

    return (
        <div className="card">
            <div className="card-hdr">
                <div>
                    <h2>{title}</h2>
                    <div className="sub" style={{marginTop:2}}>{subtitle}</div>
                </div>
                <span className={`badge badge-${badge}`}>{tranches.length} TRANCHES</span>
            </div>
            <div className="card-body">
                {/* Calibration summary boxes */}
                <div className="calib-grid">
                    {tranches.map((t, i) => (
                        <div key={i} className="calib-box">
                            <div className="tranche-name">{t.Tranche}</div>
                            <div className="metric"><span className="k">Attach</span><span className="v">{t.Attachment}-{t.Detachment}</span></div>
                            <div className="metric"><span className="k">Corr</span><span className="v tb">{t.BaseCorrelation}</span></div>
                            <div className="metric"><span className="k">Spread</span><span className="v">{fmt(Number(t.FairSpread_bps))}bp</span></div>
                            <div className="metric"><span className="k">Upfront</span><span className={`v ${Number(t.Upfront_pct)>0?'tg':'tr'}`}>{Number(t.Upfront_pct)>0?'+':''}{t.Upfront_pct}%</span></div>
                            <div className="metric"><span className="k">EL</span><span className="v ta">{t.ExpectedLoss_pct}%</span></div>
                            <div className="metric"><span className="k">CS01</span><span className="v">{'\u20AC'}{fmt(Number(t.CS01_eur))}</span></div>
                        </div>
                    ))}
                </div>

                {/* Scenario P&L table */}
                <div style={{overflowX:'auto'}}>
                    <table>
                        <thead>
                            <tr>
                                <th style={{minWidth:140}}>Tranche</th>
                                <th className="tar" style={{minWidth:60}}>Corr</th>
                                <th className="tar" style={{minWidth:60}}>Upfront</th>
                                {bumps.map(b => (
                                    <th key={b.key} className={`tar ${b.value<0?'bump-tight':b.value>0?'bump-wide':'bump-base'}`} style={{minWidth:80}}>
                                        {b.value>0?'+':''}{b.label}
                                    </th>
                                ))}
                            </tr>
                        </thead>
                        <tbody>
                            {tranches.map((t, i) => (
                                <tr key={i}>
                                    <td className="tw fm">{t.Tranche}</td>
                                    <td className="tar tb">{t.BaseCorrelation}</td>
                                    <td className={`tar fm ${Number(t.Upfront_pct)>0?'tg':'tr'}`}>{Number(t.Upfront_pct)>0?'+':''}{t.Upfront_pct}%</td>
                                    {bumps.map(b => {
                                        const val = Number(t[b.key]);
                                        return (
                                            <td key={b.key} className={`tar pnl-cell ${pnlCls(val)}`}>
                                                {fmtK(val)}
                                            </td>
                                        );
                                    })}
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    );
}

function App() {
    const [data, setData] = useState(null);
    const [loading, setLoading] = useState(true);
    const [error, setError] = useState(null);

    useEffect(() => {
        fetch('/api/tranche-scenarios?index=both')
            .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
            .then(d => { setData(d); setLoading(false); })
            .catch(e => { setError(e.message); setLoading(false); });
    }, []);

    if (loading) return <div className="loading"><div className="spin"></div>Loading tranche scenarios...</div>;
    if (error) return <div className="loading" style={{color:'var(--accent-red)'}}>Error loading data: {error}</div>;

    return (
        <>
            <header className="header">
                <div className="brand">
                    <h1><em>Macro Credit</em> Monitor</h1>
                    <span className="sep">|</span>
                    <span className="sub">Tranche Lab</span>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <div className="nav-links">
                        <a href="/" className="nav-link">Dashboard</a>
                        <a href="/cockpit" className="nav-link">Cockpit</a>
                        <a href="/swaptions" className="nav-link">Swaptions</a>
                        <a href="/risk-calculator" className="nav-link">Risk Calc</a>
                    </div>
                </div>
            </header>

            <main className="main">
                <div className="grid-2">
                    <IndexCard
                        title="iTraxx Xover S44"
                        subtitle="250bp mid | 500bp running | HY"
                        badge="blue"
                        tranches={data?.xover || []}
                    />
                    <IndexCard
                        title="iTraxx Main S44"
                        subtitle="53bp mid | 100bp running | IG"
                        badge="purple"
                        tranches={data?.main || []}
                    />
                </div>
            </main>

            <footer className="footer">
                <div className="inner">
                    <span>Macro Credit Monitor v2.0 &mdash; Real Market Calibration</span>
                    <span>Calibrated from dealer quotes &mdash; Gaussian Copula (LHP)</span>
                </div>
            </footer>
        </>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
