<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swaption Lab | Strategies in Credit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg-base:#0a0e17; --bg-card:#111827; --bg-card-alt:#151d2e; --bg-hover:#1a2436;
            --border:#1e293b; --border-dim:rgba(30,41,59,0.5);
            --text-primary:#f1f5f9; --text-secondary:#94a3b8; --text-muted:#64748b; --text-dim:#475569;
            --accent-green:#22c55e; --accent-red:#ef4444; --accent-amber:#f59e0b;
            --accent-blue:#3b82f6; --accent-teal:#14b8a6; --accent-purple:#a78bfa;
            --green-bg:rgba(34,197,94,0.10); --green-bdr:rgba(34,197,94,0.25);
            --red-bg:rgba(239,68,68,0.10); --red-bdr:rgba(239,68,68,0.25);
            --amber-bg:rgba(245,158,11,0.10); --amber-bdr:rgba(245,158,11,0.25);
            --blue-bg:rgba(59,130,246,0.10); --blue-bdr:rgba(59,130,246,0.25);
            --font-sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            --font-mono:'JetBrains Mono','Fira Code','SF Mono',monospace;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{-webkit-font-smoothing:antialiased}
        body{background:var(--bg-base);color:var(--text-primary);font-family:var(--font-sans);font-size:13px;line-height:1.5;min-height:100vh}
        ::-webkit-scrollbar{width:5px;height:5px}
        ::-webkit-scrollbar-track{background:var(--bg-base)}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

        .header{background:var(--bg-card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;padding:10px 24px;display:flex;align-items:center;justify-content:space-between}
        .brand{display:flex;align-items:center;gap:12px}
        .brand h1{font-size:17px;font-weight:700;letter-spacing:-0.3px}
        .brand em{color:var(--accent-blue);font-style:normal}
        .brand .sep{color:var(--text-dim);font-weight:300}
        .brand .sub{color:var(--accent-teal);font-size:12px;font-weight:600}
        .nav-links{display:flex;gap:8px}
        .nav-link{font-size:10px;font-family:var(--font-mono);padding:4px 10px;border-radius:4px;color:var(--text-muted);text-decoration:none;border:1px solid var(--border);transition:all .15s}
        .nav-link:hover{color:var(--text-primary);border-color:var(--accent-blue);background:var(--blue-bg)}
        .nav-link.active{color:var(--accent-teal);border-color:var(--accent-teal)}

        .main{max-width:1700px;margin:0 auto;padding:20px}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
        .grid-1{margin-bottom:16px}
        @media(max-width:1200px){.grid-2{grid-template-columns:1fr}}

        .card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:16px}
        .card-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
        .card-hdr h2{font-size:13px;font-weight:600;letter-spacing:-0.2px}
        .card-hdr .sub{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
        .card-body{padding:14px 16px}

        .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;font-family:var(--font-mono)}
        .badge-blue{background:var(--blue-bg);color:var(--accent-blue);border:1px solid var(--blue-bdr)}
        .badge-teal{background:rgba(20,184,166,0.10);color:var(--accent-teal);border:1px solid rgba(20,184,166,0.25)}
        .badge-purple{background:rgba(167,139,250,0.10);color:var(--accent-purple);border:1px solid rgba(167,139,250,0.25)}

        .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:16px}
        .stat-box{background:var(--bg-base);border-radius:6px;padding:10px 12px}
        .stat-box .lbl{font-size:9px;font-weight:500;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;font-family:var(--font-mono);margin-bottom:3px}
        .stat-box .val{font-size:16px;font-weight:700;font-family:var(--font-mono);color:var(--text-primary)}
        .stat-box .val.tg{color:var(--accent-green)}
        .stat-box .val.tr{color:var(--accent-red)}
        .stat-box .val.tb{color:var(--accent-blue)}
        .stat-box .val.tt{color:var(--accent-teal)}

        table{width:100%;border-collapse:collapse}
        th{text-align:left;padding:8px 10px;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);border-bottom:1px solid var(--border);font-family:var(--font-mono)}
        td{padding:7px 10px;font-size:12px;border-bottom:1px solid var(--border-dim);font-family:var(--font-mono)}
        tr:hover td{background:var(--bg-hover)}
        .tar{text-align:right}

        .pnl-pos{color:var(--accent-green);font-weight:600}
        .pnl-neg{color:var(--accent-red);font-weight:600}
        .pnl-zero{color:var(--text-muted)}

        .controls{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
        .ctrl-group{display:flex;align-items:center;gap:6px}
        .ctrl-group label{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
        .ctrl-group select,.ctrl-group button{font-family:var(--font-mono);font-size:11px;background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);border-radius:4px;padding:4px 8px;cursor:pointer}
        .ctrl-group select:hover,.ctrl-group button:hover{border-color:var(--accent-blue)}
        .ctrl-group button{background:var(--accent-blue);color:white;border:none;padding:6px 16px;font-weight:600}
        .ctrl-group button:disabled{opacity:0.5;cursor:not-allowed}

        .footer{border-top:1px solid var(--border);margin-top:20px;padding:10px 0}
        .footer .inner{max-width:1700px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);font-family:var(--font-mono)}

        .loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text-muted)}
        .spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent-blue);border-radius:50%;animation:spin .8s linear infinite;margin-right:10px}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const fmt = (n, dp=2) => n != null ? Number(n).toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp}) : '--';
const pnlCls = n => { const v=Number(n); return v>0?'pnl-pos':v<0?'pnl-neg':'pnl-zero'; };

function StrategyTable({ strategies }) {
    if (!strategies || strategies.length === 0) return null;
    return (
        <div style={{overflowX:'auto'}}>
            <table>
                <thead>
                    <tr>
                        <th style={{minWidth:200}}>Strategy</th>
                        <th className="tar">Premium ($M)</th>
                        <th className="tar">Delta</th>
                        <th className="tar">Gamma</th>
                        <th className="tar">Vega</th>
                        <th className="tar">Theta</th>
                        <th className="tar">Max Loss</th>
                        <th className="tar">BE Upper</th>
                        <th className="tar">BE Lower</th>
                    </tr>
                </thead>
                <tbody>
                    {strategies.map((s, i) => (
                        <tr key={i}>
                            <td style={{fontWeight:500,color:'var(--text-primary)'}}>{s.name}</td>
                            <td className={`tar ${pnlCls(-s.net_premium_dollar)}`}>{fmt(s.net_premium_dollar, 4)}</td>
                            <td className="tar">{fmt(s.net_delta)}</td>
                            <td className="tar">{fmt(s.net_gamma)}</td>
                            <td className="tar">{fmt(s.net_vega)}</td>
                            <td className={`tar ${pnlCls(s.net_theta)}`}>{fmt(s.net_theta)}</td>
                            <td className="tar" style={{color:'var(--accent-red)'}}>{fmt(s.max_loss, 4)}</td>
                            <td className="tar">{s.breakeven_upper > 0 ? fmt(s.breakeven_upper, 0) + 'bp' : '--'}</td>
                            <td className="tar">{s.breakeven_lower > 0 ? fmt(s.breakeven_lower, 0) + 'bp' : '--'}</td>
                        </tr>
                    ))}
                </tbody>
            </table>
        </div>
    );
}

function ScenarioTable({ results }) {
    if (!results || results.length === 0) return null;
    const scenarioCols = Object.keys(results[0]).filter(k => k !== 'strategy' && k !== 'premium');
    return (
        <div style={{overflowX:'auto'}}>
            <table>
                <thead>
                    <tr>
                        <th style={{minWidth:200}}>Strategy</th>
                        {scenarioCols.map(c => (
                            <th key={c} className="tar" style={{minWidth:90}}>{c}</th>
                        ))}
                    </tr>
                </thead>
                <tbody>
                    {results.map((r, i) => (
                        <tr key={i}>
                            <td style={{fontWeight:500,color:'var(--text-primary)'}}>{r.strategy}</td>
                            {scenarioCols.map(c => (
                                <td key={c} className={`tar ${pnlCls(r[c])}`}>
                                    {fmt(r[c], 3)}
                                </td>
                            ))}
                        </tr>
                    ))}
                </tbody>
            </table>
        </div>
    );
}

function App() {
    const [data, setData] = useState(null);
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState(null);
    const [index, setIndex] = useState('Both');
    const [expiry, setExpiry] = useState('3');

    const runAnalysis = useCallback(() => {
        setLoading(true);
        setError(null);
        fetch(`/api/swaption-pricing?index=${index}&expiry=${expiry}`)
            .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
            .then(d => { if(d.error) throw new Error(d.error); setData(d); setLoading(false); })
            .catch(e => { setError(e.message); setLoading(false); });
    }, [index, expiry]);

    const strategies = data?.strategies || [];
    const scenarios = data?.scenario_results || [];
    const spreads = data?.spot_spreads || {};

    return (
        <>
            <header className="header">
                <div className="brand">
                    <h1><em>Strategies</em> in Credit</h1>
                    <span className="sep">|</span>
                    <span className="sub">Swaption Lab</span>
                </div>
                <div className="nav-links">
                    <a href="/" className="nav-link">Dashboard</a>
                    <a href="/cockpit" className="nav-link">Cockpit</a>
                    <a href="/tranches" className="nav-link">Tranches</a>
                    <a href="/risk-calculator" className="nav-link">Risk Calc</a>
                    <a href="/swaptions" className="nav-link active">Swaptions</a>
                </div>
            </header>

            <main className="main">
                {/* Controls */}
                <div className="controls">
                    <div className="ctrl-group">
                        <label>Index</label>
                        <select value={index} onChange={e => setIndex(e.target.value)}>
                            <option value="Both">Both (Xover + Main)</option>
                            <option value="Crossover">Crossover</option>
                            <option value="Main">Main</option>
                        </select>
                    </div>
                    <div className="ctrl-group">
                        <label>Expiry</label>
                        <select value={expiry} onChange={e => setExpiry(e.target.value)}>
                            <option value="1">1M</option>
                            <option value="3">3M</option>
                            <option value="6">6M</option>
                            <option value="12">12M</option>
                        </select>
                    </div>
                    <div className="ctrl-group">
                        <button onClick={runAnalysis} disabled={loading}>
                            {loading ? 'Pricing...' : 'Run Swaption Pricer'}
                        </button>
                    </div>
                    {data && <span className="badge badge-teal">{data.n_priced} SWAPTIONS PRICED</span>}
                </div>

                {loading && <div className="loading"><div className="spin"></div>Running Black-76 + SABR pricing engine...</div>}
                {error && <div className="loading" style={{color:'var(--accent-red)'}}>Error: {error}</div>}

                {data && !loading && (
                    <>
                        {/* Market Data Summary */}
                        <div className="stat-grid">
                            {Object.entries(spreads).map(([idx, spread]) => (
                                <div key={idx} className="stat-box">
                                    <div className="lbl">{idx} 5Y Spot</div>
                                    <div className="val tb">{fmt(spread, 0)}bp</div>
                                </div>
                            ))}
                            <div className="stat-box">
                                <div className="lbl">Swaptions Priced</div>
                                <div className="val tt">{data.n_priced}</div>
                            </div>
                            <div className="stat-box">
                                <div className="lbl">Strategies</div>
                                <div className="val">{strategies.length}</div>
                            </div>
                            <div className="stat-box">
                                <div className="lbl">Model</div>
                                <div className="val" style={{fontSize:11}}>Black-76 + SABR</div>
                            </div>
                        </div>

                        {/* Strategy Table */}
                        <div className="card">
                            <div className="card-hdr">
                                <div>
                                    <h2>Swaption Strategies</h2>
                                    <div className="sub">{expiry}M into 5Y | ATM + wings | 7 structures per index</div>
                                </div>
                                <span className="badge badge-blue">{strategies.length} STRATEGIES</span>
                            </div>
                            <div className="card-body">
                                <StrategyTable strategies={strategies} />
                            </div>
                        </div>

                        {/* Scenario Stress Test */}
                        <div className="card">
                            <div className="card-hdr">
                                <div>
                                    <h2>Scenario Stress Test</h2>
                                    <div className="sub">P&L ($M) under 5 macro scenarios | probability-weighted E[P&L]</div>
                                </div>
                                <span className="badge badge-purple">5 SCENARIOS</span>
                            </div>
                            <div className="card-body">
                                <ScenarioTable results={scenarios} />
                            </div>
                        </div>
                    </>
                )}

                {!data && !loading && !error && (
                    <div className="card">
                        <div className="card-body" style={{textAlign:'center',padding:60,color:'var(--text-muted)'}}>
                            <div style={{fontSize:15,marginBottom:8}}>CDS Swaption Pricer</div>
                            <div style={{fontSize:12,maxWidth:500,margin:'0 auto'}}>
                                Black-76 pricing with SABR volatility surface for iTraxx Main and Crossover index swaptions.
                                Select an index and expiry, then click Run to price the full grid.
                            </div>
                        </div>
                    </div>
                )}
            </main>

            <footer className="footer">
                <div className="inner">
                    <span>Strategies in Credit v1.0 &mdash; CDS Swaption Lab</span>
                    <span>Black-76 + SABR (beta=0.5) &mdash; Payer/Receiver + 7 Strategies</span>
                </div>
            </footer>
        </>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
