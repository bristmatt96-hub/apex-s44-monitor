<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cockpit | Strategies in Credit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg-base:#0a0e17; --bg-card:#111827; --bg-card-alt:#151d2e; --bg-hover:#1a2436;
            --border:#1e293b; --border-dim:rgba(30,41,59,0.5);
            --text-primary:#f1f5f9; --text-secondary:#94a3b8; --text-muted:#64748b; --text-dim:#475569;
            --accent-green:#22c55e; --accent-red:#ef4444; --accent-amber:#f59e0b;
            --accent-blue:#3b82f6; --accent-teal:#14b8a6; --accent-purple:#a78bfa;
            --green-bg:rgba(34,197,94,0.10); --green-bdr:rgba(34,197,94,0.25);
            --red-bg:rgba(239,68,68,0.10); --red-bdr:rgba(239,68,68,0.25);
            --amber-bg:rgba(245,158,11,0.10); --amber-bdr:rgba(245,158,11,0.25);
            --blue-bg:rgba(59,130,246,0.10); --blue-bdr:rgba(59,130,246,0.25);
            --purple-bg:rgba(167,139,250,0.10); --purple-bdr:rgba(167,139,250,0.25);
            --teal-bg:rgba(20,184,166,0.10); --teal-bdr:rgba(20,184,166,0.25);
            --font-sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            --font-mono:'JetBrains Mono','Fira Code','SF Mono',monospace;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{-webkit-font-smoothing:antialiased}
        body{background:var(--bg-base);color:var(--text-primary);font-family:var(--font-sans);font-size:13px;line-height:1.5;min-height:100vh}
        ::-webkit-scrollbar{width:5px;height:5px}
        ::-webkit-scrollbar-track{background:var(--bg-base)}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

        /* Header */
        .ck-header{background:var(--bg-card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;padding:10px 24px;display:flex;align-items:center;justify-content:space-between}
        .ck-brand{display:flex;align-items:center;gap:12px}
        .ck-brand h1{font-size:17px;font-weight:700;letter-spacing:-0.3px}
        .ck-brand em{color:var(--accent-blue);font-style:normal}
        .ck-brand .sep{color:var(--text-dim);font-weight:300}
        .ck-brand .sub{color:var(--text-muted);font-size:12px}
        .ck-status{display:flex;align-items:center;gap:14px}
        .ck-stat{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
        .ck-stat strong{color:var(--text-primary);font-weight:500}
        .live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent-green);animation:pulse 2s ease-in-out infinite}
        @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,0.4)}50%{opacity:.6;box-shadow:0 0 0 4px rgba(34,197,94,0)}}
        .nav-links{display:flex;gap:8px}
        .nav-link{font-size:10px;font-family:var(--font-mono);padding:4px 10px;border-radius:4px;color:var(--text-muted);text-decoration:none;border:1px solid var(--border);transition:all .15s}
        .nav-link:hover{color:var(--text-primary);border-color:var(--accent-blue);background:var(--blue-bg)}

        /* Tab bar */
        .tab-bar{background:var(--bg-card);border-bottom:1px solid var(--border);position:sticky;top:47px;z-index:49;display:flex;padding:0 24px;gap:0}
        .tab-btn{font-family:var(--font-mono);font-size:11px;font-weight:500;padding:10px 18px;color:var(--text-muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.2px}
        .tab-btn:hover{color:var(--text-secondary);background:var(--bg-hover)}
        .tab-btn.active{color:var(--accent-blue);border-bottom-color:var(--accent-blue)}

        /* Layout */
        .ck-main{max-width:1700px;margin:0 auto;padding:16px 20px 8px}
        .ck-grid{display:grid;gap:14px}
        .g12{grid-template-columns:repeat(12,1fr)}

        /* Card */
        .card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
        .card-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)}
        .card-hdr h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary)}
        .card-body{padding:12px 14px}

        /* Badge */
        .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;font-family:var(--font-mono)}
        .badge-long{background:var(--green-bg);color:var(--accent-green);border:1px solid var(--green-bdr)}
        .badge-short{background:var(--red-bg);color:var(--accent-red);border:1px solid var(--red-bdr)}
        .badge-regime{background:var(--blue-bg);color:var(--accent-blue);border:1px solid var(--blue-bdr)}
        .badge-green{background:var(--green-bg);color:var(--accent-green)}
        .badge-amber{background:var(--amber-bg);color:var(--accent-amber)}
        .badge-red{background:var(--red-bg);color:var(--accent-red)}
        .badge-blue{background:var(--blue-bg);color:var(--accent-blue);border:1px solid var(--blue-bdr)}
        .badge-purple{background:var(--purple-bg);color:var(--accent-purple);border:1px solid var(--purple-bdr)}

        /* Table */
        table{width:100%;border-collapse:collapse}
        th{text-align:left;padding:6px 8px;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);border-bottom:1px solid var(--border);font-family:var(--font-mono)}
        td{padding:6px 8px;font-size:12px;border-bottom:1px solid var(--border-dim)}
        tr:hover td{background:var(--bg-hover)}

        /* Metric Box */
        .mbox{background:var(--bg-base);border-radius:6px;padding:10px 12px}
        .mbox .lbl{font-size:10px;font-weight:500;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;font-family:var(--font-mono);margin-bottom:4px}
        .mbox .val{font-size:18px;font-weight:700;font-family:var(--font-mono);line-height:1.1}
        .mbox .sub{font-size:10px;color:var(--text-muted);font-family:var(--font-mono);margin-top:2px}

        /* Risk bar */
        .rbar{height:5px;border-radius:3px;background:var(--bg-base);overflow:hidden;margin-top:4px}
        .rbar .fill{height:100%;border-radius:3px;transition:width .4s ease}

        /* Severity strip */
        .sev{border-left:3px solid var(--border);padding:6px 10px;margin-bottom:4px;border-radius:0 6px 6px 0;background:var(--bg-card-alt);transition:background .15s}
        .sev:hover{background:var(--bg-hover)}
        .sev-high{border-left-color:var(--accent-red)}
        .sev-medium{border-left-color:var(--accent-amber)}
        .sev-low{border-left-color:var(--accent-teal)}

        /* Conviction dots */
        .dots{display:inline-flex;gap:2px}
        .dots .on{color:var(--accent-blue);font-size:8px}
        .dots .off{color:var(--text-dim);font-size:8px;opacity:.3}

        /* Traffic light */
        .tl-green{color:var(--accent-green)}
        .tl-amber{color:var(--accent-amber)}
        .tl-red{color:var(--accent-red)}

        /* Utilities */
        .mono{font-family:var(--font-mono)}
        .tg{color:var(--accent-green)}.tr{color:var(--accent-red)}.ta{color:var(--accent-amber)}.tb{color:var(--accent-blue)}.tt{color:var(--accent-teal)}.tp{color:var(--accent-purple)}
        .tw{color:var(--text-primary)}.ts{color:var(--text-secondary)}.tm{color:var(--text-muted)}.td{color:var(--text-dim)}
        .tar{text-align:right}.tac{text-align:center}
        .fb{font-weight:700}.fm{font-weight:500}

        /* Footer */
        .ck-footer{border-top:1px solid var(--border);margin-top:14px;padding:10px 0}
        .ck-footer .inner{max-width:1700px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);font-family:var(--font-mono)}

        /* Span helpers */
        .c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}

        /* Loading */
        .loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text-muted)}
        .spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent-blue);border-radius:50%;animation:spin .8s linear infinite;margin-right:10px}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* Placeholder panels */
        .placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
        .placeholder .icon{font-size:40px;margin-bottom:12px;opacity:0.4}
        .placeholder h3{font-size:15px;font-weight:600;margin-bottom:8px;color:var(--text-secondary)}
        .placeholder p{font-size:12px;color:var(--text-muted);max-width:400px;line-height:1.6}

        /* Tranche lab */
        .tranche-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
        @media(max-width:1200px){.tranche-grid{grid-template-columns:1fr}}
        .calib-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
        .calib-box{background:var(--bg-base);border-radius:6px;padding:8px 10px}
        .calib-box .tranche-name{font-size:11px;font-weight:600;margin-bottom:5px}
        .calib-box .metric{display:flex;justify-content:space-between;padding:2px 0;font-size:10px}
        .calib-box .metric .k{color:var(--text-muted)}
        .calib-box .metric .v{color:var(--text-primary);font-family:var(--font-mono);font-weight:500}

        .pnl-pos{color:var(--accent-green);font-weight:600}
        .pnl-neg{color:var(--accent-red);font-weight:600}
        .pnl-zero{color:var(--text-muted)}
        .bump-tight{color:var(--accent-green)}.bump-wide{color:var(--accent-red)}.bump-base{color:var(--accent-amber)}

        /* Equity Bridge */
        .eb-top5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
        @media(max-width:1200px){.eb-top5{grid-template-columns:repeat(3,1fr)}}
        @media(max-width:800px){.eb-top5{grid-template-columns:1fr 1fr}}
        .eb-card{background:var(--bg-base);border-radius:8px;padding:12px 14px;border-left:3px solid var(--border);position:relative}
        .eb-card.strong{border-left-color:var(--accent-red)}
        .eb-card.moderate{border-left-color:var(--accent-amber)}
        .eb-card.weak{border-left-color:var(--text-dim)}
        .eb-card .eb-name{font-size:12px;font-weight:600;margin-bottom:2px}
        .eb-card .eb-ticker{font-size:10px;color:var(--text-muted);font-family:var(--font-mono);margin-bottom:8px}
        .eb-card .eb-sector{font-size:9px;color:var(--text-dim);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.3px}
        .eb-scores{display:flex;gap:8px;margin:8px 0}
        .eb-scores .eb-sc{flex:1;background:var(--bg-card);border-radius:5px;padding:5px 8px;text-align:center}
        .eb-scores .eb-sc .k{display:block;font-size:9px;color:var(--text-dim);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
        .eb-scores .eb-sc .v{font-size:16px;font-weight:700;font-family:var(--font-mono)}
        .eb-gap-bar{height:4px;border-radius:2px;background:var(--bg-card);overflow:hidden;margin-top:6px}
        .eb-gap-bar .fill{height:100%;border-radius:2px;transition:width .4s ease}
        .eb-struct{font-size:10px;font-family:var(--font-mono);padding:4px 8px;border-radius:4px;display:inline-block;margin-top:6px}
        .eb-struct.otm_put,.eb-struct.far_otm_put{background:var(--red-bg);color:var(--accent-red);border:1px solid var(--red-bdr)}
        .eb-struct.put_spread,.eb-struct.atm_put_spread{background:var(--amber-bg);color:var(--accent-amber);border:1px solid var(--amber-bdr)}
        .eb-struct.straddle{background:var(--purple-bg);color:var(--accent-purple);border:1px solid var(--purple-bdr)}
        .eb-struct.etf_put{background:var(--blue-bg);color:var(--accent-blue);border:1px solid var(--blue-bdr)}
        .eb-struct.calendar_put_spread{background:var(--teal-bg);color:var(--accent-teal);border:1px solid var(--teal-bdr)}
        .eb-struct.monitor,.eb-struct.skip{background:var(--bg-card);color:var(--text-muted);border:1px solid var(--border)}
        .eb-row-strong{background:rgba(239,68,68,0.04)}
        .eb-row-moderate{background:rgba(245,158,11,0.04)}
        .eb-detail-panel{background:var(--bg-base);border-radius:8px;padding:14px;margin-top:10px}
        .eb-detail-panel h3{font-size:12px;font-weight:600;margin-bottom:8px}
        .eb-comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
        .eb-comp{background:var(--bg-card);border-radius:5px;padding:6px 8px}
        .eb-comp .k{font-size:9px;color:var(--text-dim);font-family:var(--font-mono);text-transform:uppercase;display:block;margin-bottom:2px}
        .eb-comp .v{font-size:13px;font-weight:600;font-family:var(--font-mono)}
        .eb-notes{font-size:11px;color:var(--text-secondary);line-height:1.6;margin-top:8px}
        .eb-notes li{margin-bottom:2px}
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

/* ================================================================
   HELPERS
   ================================================================ */
const API = '';
const fmt = (n, dp=0) => n != null ? Number(n).toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp}) : '--';
const fmtK = n => { if(n==null) return '--'; const v=Math.round(n/1000); return v>=0?'+$'+fmt(Math.abs(v))+'k':'-$'+fmt(Math.abs(v))+'k'; };
const fmtM = n => { if(n==null) return '--'; const v=n/1e6; return (v>=0?'+':'')+'$'+fmt(Math.abs(v),2)+'M'; };
const fmtEK = n => { if(n==null||n==='') return '--'; const v=Math.round(Number(n)/1000); return (v>0?'+':'')+'\u20AC'+fmt(v)+'k'; };
const pnlCls = n => n>0?'tg':n<0?'tr':'ts';
const pnlCls2 = n => { const v=Number(n); return v>0?'pnl-pos':v<0?'pnl-neg':'pnl-zero'; };
const trunc = (s,n=80) => { const t=s||''; return t.length>n?t.substring(0,n)+'\u2026':t; };
const convDots = c => Array.from({length:5},(_,i) => <span key={i} className={i<c?'on':'off'}>{'\u25CF'}</span>);

async function fetchJSON(url) {
    try { const r = await fetch(API+url); if(!r.ok) throw new Error(r.status); return await r.json(); }
    catch(e) { console.error('Fetch:',url,e); return null; }
}

/* ================================================================
   SHARED COMPONENTS
   ================================================================ */

function Badge({type,children}) {
    return <span className={`badge badge-${type}`}>{children}</span>;
}

function MetricBox({label,value,sub,cls}) {
    return (
        <div className="mbox">
            <div className="lbl">{label}</div>
            <div className={`val ${cls||'tw'}`}>{value}</div>
            {sub && <div className="sub">{sub}</div>}
        </div>
    );
}

function RiskBar({current,limit,status}) {
    const pct = Math.min(Math.abs(current)/limit*100,100);
    return <div className="rbar"><div className="fill" style={{width:pct+'%',background:status==='GREEN'?'var(--accent-green)':status==='AMBER'?'var(--accent-amber)':'var(--accent-red)'}}></div></div>;
}

function TrafficDot({status}) {
    const cls = status==='GREEN'?'tl-green':status==='AMBER'?'tl-amber':'tl-red';
    return <span className={cls}>{'\u25CF'}</span>;
}

/* ================================================================
   TAB 1: DASHBOARD
   ================================================================ */

function RegimePanel({dispersion}) {
    if(!dispersion) return null;
    return (
        <div className="card c12">
            <div className="card-hdr">
                <h2>Market Regime</h2>
                <Badge type={dispersion.regime==='HIGH'?'green':dispersion.regime==='LOW'?'red':'regime'}>{dispersion.regime} DISPERSION</Badge>
            </div>
            <div className="card-body" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:10}}>
                <MetricBox label="Dispersion CV" value={dispersion.universe_cv||'--'} sub={dispersion.regime_description} />
                <MetricBox label="Universe Mean" value={(dispersion.universe_mean||0)+'bp'} sub={`\u00B1${dispersion.universe_stdev||0}bp stdev`} />
                <MetricBox label="Pair Trade Sectors" value={(dispersion.pair_trade_sectors||[]).length}
                    sub={(dispersion.pair_trade_sectors||[]).slice(0,3).join(', ')||'None'} cls="tp" />
                <MetricBox label="Sector Dispersion" value={(dispersion.sectors||[]).filter(s=>s.regime==='HIGH').length+' HIGH'}
                    sub={`of ${(dispersion.sectors||[]).length} sectors`} cls="ta" />
            </div>
        </div>
    );
}

function TopIdeasPanel({screen}) {
    if(!screen) return null;
    const IdeaRow = ({n}) => (
        <tr>
            <td className="tw fm">{trunc(n.entity_name,26)}</td>
            <td className="tac"><span className="dots">{convDots(n.conviction)}</span></td>
            <td className="tar mono tw">{fmt(n.current_spread)}<span className="td">bp</span></td>
            <td className="tar mono ts">{fmt(n.fair_spread)}</td>
            <td className={`tar mono fm ${n.mispricing_bps>0?'tg':'tr'}`}>{n.mispricing_bps>0?'+':''}{fmt(n.mispricing_bps)}</td>
            <td className="tm" style={{fontSize:11}}>{trunc(n.thesis,50)}</td>
        </tr>
    );
    return (
        <div className="card c12">
            <div className="card-hdr">
                <h2>Top Ideas</h2>
                <div style={{display:'flex',gap:8}}><Badge type="long">Longs</Badge><Badge type="short">Shorts</Badge></div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr'}}>
                <div style={{borderRight:'1px solid var(--border)',padding:'10px 14px'}}>
                    <table><thead><tr><th style={{width:'28%'}}>Entity</th><th className="tac" style={{width:'10%'}}>Conv</th><th className="tar" style={{width:'12%'}}>Spread</th><th className="tar" style={{width:'10%'}}>Fair</th><th className="tar" style={{width:'12%'}}>Misprc</th><th style={{width:'28%'}}>Thesis</th></tr></thead>
                    <tbody>{(screen.top_longs||[]).map((n,i)=><IdeaRow key={i} n={n}/>)}</tbody></table>
                </div>
                <div style={{padding:'10px 14px'}}>
                    <table><thead><tr><th style={{width:'28%'}}>Entity</th><th className="tac" style={{width:'10%'}}>Conv</th><th className="tar" style={{width:'12%'}}>Spread</th><th className="tar" style={{width:'10%'}}>Fair</th><th className="tar" style={{width:'12%'}}>Misprc</th><th style={{width:'28%'}}>Thesis</th></tr></thead>
                    <tbody>{(screen.top_shorts||[]).map((n,i)=><IdeaRow key={i} n={n}/>)}</tbody></table>
                </div>
            </div>
        </div>
    );
}

function FilingsPanel({filings}) {
    const data = filings||{filings:[],count:0};
    return (
        <div className="card c7">
            <div className="card-hdr">
                <h2>Filing Alerts</h2>
                <span className="mono td" style={{fontSize:10}}>{data.count} alerts</span>
            </div>
            <div className="card-body" style={{padding:'8px 10px',maxHeight:260,overflowY:'auto'}}>
                {(data.filings||[]).length===0 ? <div className="td" style={{padding:12,textAlign:'center'}}>No recent filings</div>
                : (data.filings||[]).map((f,i) => {
                    const sevCls = f.severity>=4?'sev-high':f.severity>=3?'sev-medium':'sev-low';
                    return (
                        <div key={i} className={`sev ${sevCls}`}>
                            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                                <div style={{display:'flex',alignItems:'center',gap:6}}>
                                    <span className="tw fm" style={{fontSize:12}}>{f.matched_entity||f.company_name}</span>
                                    <Badge type={f.credit_impact==='negative'?'red':f.credit_impact==='positive'?'green':'amber'}>{f.credit_impact||'neutral'}</Badge>
                                </div>
                                <span className="mono td" style={{fontSize:10}}>{f.date}</span>
                            </div>
                            <div className="ts" style={{fontSize:11,marginTop:3}}>{trunc(f.credit_summary||f.headline,120)}</div>
                            <div className="mono td" style={{fontSize:9,marginTop:2}}>{f.source} &middot; sev {f.severity}/5</div>
                        </div>
                    );
                })}
            </div>
        </div>
    );
}

function RVPanel({rv}) {
    if(!rv||rv.error) return null;
    const RVName = ({n,type}) => {
        const cls = type==='cheap'?'tg':'tr';
        return (
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 0',borderBottom:'1px solid var(--border-dim)'}}>
                <div><span className="tw" style={{fontSize:12}}>{trunc(n.entity_name,22)}</span>
                    <span className="td" style={{fontSize:10,marginLeft:4}}>{n.sector}</span></div>
                <div className="mono tar" style={{fontSize:11}}>

function TrancheLabTab({tranches}) {

                                <div className="metric"><span className="k">Spread</span><span className="v">{fmt(Number(t.FairSpread_bps))}bp</span></div>

                                <div className="metric"><span className="k">EL</span><span className="v ta">{t.ExpectedLoss_pct}%</span></div>
                            </div>
                        ))}
                    </div>
                    <div style={{overflowX:'auto'}}>

                            <thead>
                                <tr>

}

/* ================================================================
   TAB 7: EQUITY BRIDGE
   ================================================================ */
function EquityBridgeTab() {
    const [bridgeData, setBridgeData] = useState(null);
    const [loading, setLoading] = useState(true);
    const [expanded, setExpanded] = useState(null);
    const [sortBy, setSortBy] = useState('gap_score');
    const [filterSignal, setFilterSignal] = useState('ALL');

    useEffect(() => {
        (async () => {
            const d = await fetchJSON('/api/equity-bridge');
            setBridgeData(d);
            setLoading(false);
        })();
    }, []);

    if (loading) return <div className="loading"><div className="spin"></div>Loading equity bridge data...</div>;
    if (!bridgeData || !bridgeData.names) return (
        <div className="card"><div className="card-body"><div className="td tac" style={{padding:30}}>No equity bridge data available. Ensure market data is loaded.</div></div></div>
    );

    const names = bridgeData.names;

    // Filter
    const filtered = filterSignal === 'ALL' ? names : names.filter(n => n.gap_signal === filterSignal);

    // Sort
    const sorted = [...filtered].sort((a,b) => {
        if (sortBy === 'gap_score') return (b.gap_score||0) - (a.gap_score||0);
        if (sortBy === 'credit_signal_score') return (b.credit_signal_score||0) - (a.credit_signal_score||0);
        if (sortBy === 'equity_repricing_score') return (a.equity_repricing_score||0) - (b.equity_repricing_score||0);
        if (sortBy === 'cds_spread') return (b.cds_spread||0) - (a.cds_spread||0);
        if (sortBy === 'entity_name') return (a.entity_name||'').localeCompare(b.entity_name||'');
        return 0;
    });

    // Top 5 with STRONG or MODERATE signal
    const top5 = names.filter(n => n.gap_signal === 'STRONG' || n.gap_signal === 'MODERATE')
        .sort((a,b) => (b.gap_score||0) - (a.gap_score||0))
        .slice(0, 5);

    // Summary stats
    const strongCount = names.filter(n => n.gap_signal === 'STRONG').length;
    const modCount = names.filter(n => n.gap_signal === 'MODERATE').length;
    const weakCount = names.filter(n => n.gap_signal === 'WEAK').length;
    const avgGap = names.length > 0 ? (names.reduce((s,n) => s + (n.gap_score||0), 0) / names.length).toFixed(1) : '--';

    const gapColor = (gap) => {
        if (gap >= 50) return 'var(--accent-red)';
        if (gap >= 30) return 'var(--accent-amber)';
        if (gap >= 10) return 'var(--accent-blue)';
        return 'var(--text-dim)';
    };

    const signalBadge = (sig) => {
        if (sig === 'STRONG') return 'red';
        if (sig === 'MODERATE') return 'amber';
        if (sig === 'WEAK') return 'blue';
        return 'regime';
    };

    const structClass = (s) => {
        if (!s) return 'monitor';
        return s.toLowerCase().replace(/\s+/g,'_');
    };

    const scoreBar = (val, max=100) => {
        const pct = Math.min(Math.max(val||0, 0), max) / max * 100;
        return pct;
    };

    return (
        <div className="ck-grid g12">
            {/* Summary strip */}
            <div className="card c12">
                <div className="card-hdr">
                    <div>
                        <h2>Credit-Equity Options Bridge</h2>
                        <span className="mono td" style={{fontSize:10}}>Gap = Credit Signal - Equity Repricing | High gap = equity hasn't caught up with credit stress</span>
                    </div>
                    <div style={{display:'flex',gap:8,alignItems:'center'}}>
                        <Badge type="red">{strongCount} STRONG</Badge>
                        <Badge type="amber">{modCount} MODERATE</Badge>
                        <Badge type="blue">{weakCount} WEAK</Badge>
                        <span className="mono td" style={{fontSize:10}}>Avg Gap: {avgGap}</span>
                    </div>
                </div>
            </div>

            {/* Top 5 opportunities */}
            {top5.length > 0 && (
                <div className="card c12">
                    <div className="card-hdr">
                        <h2>Top Opportunities</h2>
                        <Badge type="green">{top5.length} NAMES</Badge>
                    </div>
                    <div className="card-body">
                        <div className="eb-top5">
                            {top5.map((n, i) => (
                                <div key={i} className={`eb-card ${n.gap_signal.toLowerCase()}`}>
                                    <div className="eb-name">{n.entity_name}</div>
                                    <div className="eb-ticker">{n.equity_ticker || '--'} <span style={{marginLeft:6}}><Badge type={signalBadge(n.gap_signal)}>{n.gap_signal}</Badge></span></div>
                                    <div className="eb-sector">{n.sector}</div>
                                    <div className="eb-scores">
                                        <div className="eb-sc"><span className="k">Credit</span><span className="v tr">{(n.credit_signal_score||0).toFixed(0)}</span></div>
                                        <div className="eb-sc"><span className="k">Equity</span><span className="v tg">{n.equity_repricing_score != null ? n.equity_repricing_score.toFixed(0) : '--'}</span></div>
                                        <div className="eb-sc"><span className="k">Gap</span><span className="v" style={{color:gapColor(n.gap_score)}}>{(n.gap_score||0).toFixed(0)}</span></div>
                                    </div>
                                    <div className="eb-gap-bar">
                                        <div className="fill" style={{width:scoreBar(n.gap_score)+'%',background:gapColor(n.gap_score)}}></div>
                                    </div>
                                    {n.recommended_structure && n.recommended_structure !== 'MONITOR' && n.recommended_structure !== 'SKIP' && (
                                        <div className={`eb-struct ${structClass(n.recommended_structure)}`}>{n.recommended_structure.replace(/_/g,' ')}</div>
                                    )}
                                    <div style={{fontSize:10,color:'var(--text-muted)',fontFamily:'var(--font-mono)',marginTop:4}}>
                                        {n.cds_spread ? fmt(n.cds_spread)+'bp' : '--'} CDS
                                        {n.implied_pd_5y ? ' | PD '+n.implied_pd_5y.toFixed(1)+'%' : ''}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            )}

            {/* Full heatmap table */}
            <div className="card c12">
                <div className="card-hdr">
                    <div style={{display:'flex',alignItems:'center',gap:12}}>
                        <h2>Gap Score Heatmap</h2>
                        <span className="mono td" style={{fontSize:10}}>{sorted.length} names</span>
                    </div>
                    <div style={{display:'flex',gap:6}}>
                        {['ALL','STRONG','MODERATE','WEAK','NONE'].map(f => (
                            <button key={f} onClick={() => setFilterSignal(f)}
                                style={{
                                    fontSize:10,fontFamily:'var(--font-mono)',padding:'3px 8px',borderRadius:4,cursor:'pointer',
                                    background:filterSignal===f?'var(--blue-bg)':'transparent',
                                    color:filterSignal===f?'var(--accent-blue)':'var(--text-muted)',
                                    border:filterSignal===f?'1px solid var(--blue-bdr)':'1px solid var(--border)',
                                }}>
                                {f}
                            </button>
                        ))}
                    </div>
                </div>
                <div className="card-body" style={{overflowX:'auto'}}>
                    <table>
                        <thead>
                            <tr>
                                <th style={{cursor:'pointer',minWidth:150}} onClick={() => setSortBy('entity_name')}>Entity {sortBy==='entity_name'?'\u25B2':''}</th>
                                <th>Ticker</th>
                                <th>Sector</th>
                                <th className="tar" style={{cursor:'pointer'}} onClick={() => setSortBy('cds_spread')}>CDS {sortBy==='cds_spread'?'\u25BC':''}</th>
                                <th className="tar" style={{cursor:'pointer'}} onClick={() => setSortBy('credit_signal_score')}>Credit Score {sortBy==='credit_signal_score'?'\u25BC':''}</th>
                                <th className="tar" style={{cursor:'pointer'}} onClick={() => setSortBy('equity_repricing_score')}>Equity Score {sortBy==='equity_repricing_score'?'\u25B2':''}</th>
                                <th className="tar" style={{cursor:'pointer'}} onClick={() => setSortBy('gap_score')}>Gap Score {sortBy==='gap_score'?'\u25BC':''}</th>
                                <th className="tac">Signal</th>
                                <th>Structure</th>
                            </tr>
                        </thead>
                        <tbody>
                            {sorted.map((n, i) => (
                                <React.Fragment key={i}>
                                    <tr className={n.gap_signal==='STRONG'?'eb-row-strong':n.gap_signal==='MODERATE'?'eb-row-moderate':''}
                                        style={{cursor:'pointer'}} onClick={() => setExpanded(expanded===i?null:i)}>
                                        <td className="tw fm">{n.entity_name}</td>
                                        <td className="mono ts" style={{fontSize:11}}>{n.equity_ticker || <span className="td">private</span>}</td>
                                        <td className="td" style={{fontSize:11}}>{n.sector}</td>
                                        <td className="tar mono tw">{n.cds_spread ? fmt(n.cds_spread)+'bp' : '--'}</td>
                                        <td className="tar mono">
                                            <span style={{color:n.credit_signal_score>=60?'var(--accent-red)':n.credit_signal_score>=40?'var(--accent-amber)':'var(--text-secondary)'}}>
                                                {n.credit_signal_score!=null ? n.credit_signal_score.toFixed(1) : '--'}
                                            </span>
                                        </td>
                                        <td className="tar mono">
                                            <span style={{color:n.equity_repricing_score!=null?(n.equity_repricing_score>=60?'var(--accent-green)':n.equity_repricing_score>=40?'var(--accent-amber)':'var(--text-dim)'):'var(--text-dim)'}}>
                                                {n.equity_repricing_score != null ? n.equity_repricing_score.toFixed(1) : '--'}
                                            </span>
                                        </td>
                                        <td className="tar mono fb" style={{color:gapColor(n.gap_score||0)}}>
                                            {n.gap_score != null ? n.gap_score.toFixed(1) : '--'}
                                        </td>
                                        <td className="tac"><Badge type={signalBadge(n.gap_signal)}>{n.gap_signal}</Badge></td>
                                        <td>
                                            {n.recommended_structure && n.recommended_structure !== 'MONITOR' && n.recommended_structure !== 'SKIP'
                                                ? <span className={`eb-struct ${structClass(n.recommended_structure)}`}>{n.recommended_structure.replace(/_/g,' ')}</span>
                                                : <span className="td mono" style={{fontSize:10}}>{n.recommended_structure || '--'}</span>
                                            }
                                        </td>
                                    </tr>
                                    {expanded === i && (
                                        <tr>
                                            <td colSpan={9} style={{padding:0,border:'none'}}>
                                                <div className="eb-detail-panel">
                                                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
                                                        {/* Credit components */}
                                                        <div>
                                                            <h3 style={{color:'var(--accent-red)'}}>Credit Signal Components</h3>
                                                            {n.credit_components && (
                                                                <div className="eb-comp-grid">
                                                                    {Object.entries(n.credit_components).map(([k,v]) => (
                                                                        <div key={k} className="eb-comp">
                                                                            <span className="k">{k.replace(/_/g,' ')}</span>
                                                                            <span className="v" style={{color:v>=60?'var(--accent-red)':v>=40?'var(--accent-amber)':'var(--text-secondary)'}}>{v.toFixed(1)}</span>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            )}
                                                            <div style={{marginTop:8,fontSize:11,color:'var(--text-muted)',fontFamily:'var(--font-mono)'}}>
                                                                {n.cds_spread ? 'CDS: '+fmt(n.cds_spread)+'bp' : ''}
                                                                {n.fair_spread ? ' | Fair: '+fmt(n.fair_spread)+'bp' : ''}
                                                                {n.implied_pd_5y ? ' | PD: '+n.implied_pd_5y.toFixed(1)+'%' : ''}
                                                                {n.direction ? ' | '+n.direction : ''}
                                                            </div>
                                                        </div>
                                                        {/* Equity components */}
                                                        <div>
                                                            <h3 style={{color:'var(--accent-green)'}}>Equity Repricing Components</h3>
                                                            {n.equity_components ? (
                                                                <div className="eb-comp-grid">
                                                                    {Object.entries(n.equity_components).map(([k,v]) => (
                                                                        <div key={k} className="eb-comp">
                                                                            <span className="k">{k.replace(/_/g,' ')}</span>
                                                                            <span className="v" style={{color:v>=60?'var(--accent-green)':v>=40?'var(--accent-amber)':'var(--text-dim)'}}>{v.toFixed(1)}</span>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            ) : (
                                                                <div className="td" style={{fontSize:11,padding:8}}>No equity data available (private company or no options)</div>
                                                            )}
                                                            <div style={{marginTop:8,fontSize:11,color:'var(--text-muted)',fontFamily:'var(--font-mono)'}}>
                                                                {n.stock_price ? 'Price: '+n.stock_price.toFixed(2) : ''}
                                                                {n.stock_chg_5d != null ? ' | 5d: '+(n.stock_chg_5d>0?'+':'')+n.stock_chg_5d.toFixed(1)+'%' : ''}
                                                                {n.iv_percentile != null ? ' | IV%ile: '+n.iv_percentile.toFixed(0) : ''}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    {/* Trade recommendation */}
                                                    {n.recommended_details && n.recommended_structure !== 'MONITOR' && n.recommended_structure !== 'SKIP' && (
                                                        <div style={{marginTop:12,background:'var(--bg-card)',borderRadius:6,padding:10}}>
                                                            <h3 style={{color:'var(--accent-blue)'}}>Trade Recommendation: {(n.recommended_structure||'').replace(/_/g,' ')}</h3>
                                                            <div style={{display:'flex',gap:16,marginTop:6,fontSize:11,fontFamily:'var(--font-mono)',color:'var(--text-secondary)'}}>
                                                                {n.recommended_details.strike_pct ? <span>Strike: {(n.recommended_details.strike_pct*100).toFixed(0)}%</span> : null}
                                                                {n.recommended_details.expiry_months ? <span>Expiry: {n.recommended_details.expiry_months}m</span> : null}
                                                                {n.recommended_details.target_delta ? <span>Delta: {n.recommended_details.target_delta.toFixed(2)}</span> : null}
                                                                {n.recommended_details.max_premium_pct ? <span>Max Premium: {n.recommended_details.max_premium_pct}%</span> : null}
                                                                {n.recommended_details.conviction ? <span>Conviction: <strong>{n.recommended_details.conviction}</strong></span> : null}
                                                            </div>
                                                            {n.recommended_details.rationale && (
                                                                <div style={{fontSize:11,color:'var(--text-muted)',marginTop:4,fontStyle:'italic'}}>{n.recommended_details.rationale}</div>
                                                            )}
                                                            {n.recommended_details.entry_notes && n.recommended_details.entry_notes.length > 0 && (
                                                                <ul className="eb-notes">
                                                                    {n.recommended_details.entry_notes.map((note,ni) => <li key={ni}>{note}</li>)}
                                                                </ul>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            </td>
                                        </tr>
                                    )}
                                </React.Fragment>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    );
}

/* ================================================================
   APP
   ================================================================ */
const TABS = [
    { id: 'dashboard', label: 'Dashboard' },
    { id: 'portfolio', label: 'Portfolio & Risk' },
    { id: 'signals', label: 'Signal Feed' },
    { id: 'docs', label: 'Doc Analysis' },
    { id: 'tranches', label: 'Tranche Lab' },
    { id: 'macro', label: 'Macro Regime' },
    { id: 'bridge', label: 'Equity Bridge' },
];

function App() {
    const [data, setData] = useState(null);
    const [tranches, setTranches] = useState(null);
    const [loading, setLoading] = useState(true);
    const [activeTab, setActiveTab] = useState('dashboard');
    const [lastUpdated, setLastUpdated] = useState('');

    const loadAll = useCallback(async () => {
        const [screen, portfolio, risk, filings, rv, maturity, dispersion, scenarios] = await Promise.all([
            fetchJSON('/api/screen'),
            fetchJSON('/api/portfolio'),
            fetchJSON('/api/risk'),
            fetchJSON('/api/filings'),
            fetchJSON('/api/rv'),
            fetchJSON('/api/maturity'),
            fetchJSON('/api/dispersion'),
            fetchJSON('/api/scenarios'),
        ]);
        setData({screen, portfolio, risk, filings, rv, maturity, dispersion, scenarios});
        setLoading(false);
        setLastUpdated(new Date().toLocaleTimeString('en-GB'));
    }, []);

    const loadTranches = useCallback(async () => {
        const t = await fetchJSON('/api/tranche-scenarios?index=both');
        setTranches(t);
    }, []);

    useEffect(() => {
        loadAll();
        loadTranches();
        const interval = setInterval(loadAll, 300000);
        return () => clearInterval(interval);
    }, [loadAll, loadTranches]);

    if (loading) return <div className="loading"><div className="spin"></div>Loading cockpit data...</div>;

    const d = data || {};
    const screen = d.screen;

    return (
        <>
            {/* HEADER */}
            <header className="ck-header">
                <div className="ck-brand">
                    <h1><em>Strategies</em> in Credit</h1>
                    <span className="sep">|</span>
                    <span className="sub">Cockpit</span>
                </div>
                <div className="ck-status">
                    <div className="nav-links">
                        <a href="/" className="nav-link">Screen</a>
                        <a href="/tranches" className="nav-link">Tranches</a>
                        <a href="/risk-calculator" className="nav-link">Risk Calc</a>
                    </div>
                    {d.dispersion && d.dispersion.regime &&
                        <Badge type={d.dispersion.regime==='HIGH'?'green':d.dispersion.regime==='LOW'?'red':'regime'}>
                            {d.dispersion.regime} DISPERSION
                        </Badge>
                    }
                    {screen && <span className="ck-stat">
                        <strong>{screen.count}</strong> names &middot;
                        <span className="tg"> {screen.long_count}L</span> /
                        <span className="tr"> {screen.short_count}S</span> &middot;
                        Conv <strong>{screen.avg_conviction}</strong> &middot;
                        Avg <strong>{fmt(screen.avg_spread)}bp</strong>
                    </span>}
                    <span className="ck-stat">{new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</span>
                    <div className="live-dot" title="Live"></div>
                </div>
            </header>

            {/* TAB BAR */}
            <nav className="tab-bar">
                {TABS.map(tab => (
                    <button key={tab.id} className={`tab-btn ${activeTab===tab.id?'active':''}`}
                        onClick={() => setActiveTab(tab.id)}>
                        {tab.label}
                    </button>
                ))}
            </nav>

            {/* MAIN CONTENT */}
            <main className="ck-main">
                {activeTab === 'dashboard' && <DashboardTab d={d} />}
                {activeTab === 'portfolio' && <PortfolioRiskTab d={d} />}
                {activeTab === 'signals' && <SignalFeedTab />}
                {activeTab === 'docs' && <DocAnalysisTab />}
                {activeTab === 'tranches' && <TrancheLabTab tranches={tranches} />}
                {activeTab === 'macro' && <MacroRegimeTab d={d} />}
                {activeTab === 'bridge' && <EquityBridgeTab />}
            </main>

            {/* FOOTER */}
            <footer className="ck-footer">
                <div className="inner">
                    <span>Strategies in Credit v2.0 &mdash; iTraxx Xover S44 Cockpit</span>
                    <span>Updated {lastUpdated}</span>
                </div>
            </footer>
        </>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
