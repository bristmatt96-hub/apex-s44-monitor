<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cockpit | Strategies in Credit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg-base:#0a0e17; --bg-card:#111827; --bg-card-alt:#151d2e; --bg-hover:#1a2436;
            --border:#1e293b; --border-dim:rgba(30,41,59,0.5);
            --text-primary:#f1f5f9; --text-secondary:#94a3b8; --text-muted:#64748b; --text-dim:#475569;
            --accent-green:#22c55e; --accent-red:#ef4444; --accent-amber:#f59e0b;
            --accent-blue:#3b82f6; --accent-teal:#14b8a6; --accent-purple:#a78bfa;
            --green-bg:rgba(34,197,94,0.10); --green-bdr:rgba(34,197,94,0.25);
            --red-bg:rgba(239,68,68,0.10); --red-bdr:rgba(239,68,68,0.25);
            --amber-bg:rgba(245,158,11,0.10); --amber-bdr:rgba(245,158,11,0.25);
            --blue-bg:rgba(59,130,246,0.10); --blue-bdr:rgba(59,130,246,0.25);
            --font-sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            --font-mono:'JetBrains Mono','Fira Code','SF Mono',monospace;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{-webkit-font-smoothing:antialiased}
        body{background:var(--bg-base);color:var(--text-primary);font-family:var(--font-sans);font-size:13px;line-height:1.5;min-height:100vh}
        ::-webkit-scrollbar{width:5px;height:5px}
        ::-webkit-scrollbar-track{background:var(--bg-base)}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

        /* Header */
        .ck-header{background:var(--bg-card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;padding:10px 24px;display:flex;align-items:center;justify-content:space-between}
        .ck-brand{display:flex;align-items:center;gap:12px}
        .ck-brand h1{font-size:17px;font-weight:700;letter-spacing:-0.3px}
        .ck-brand em{color:var(--accent-blue);font-style:normal}
        .ck-brand .sep{color:var(--text-dim);font-weight:300}
        .ck-brand .sub{color:var(--text-muted);font-size:12px}
        .ck-status{display:flex;align-items:center;gap:14px}
        .ck-stat{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
        .ck-stat strong{color:var(--text-primary);font-weight:500}
        .live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent-green);animation:pulse 2s ease-in-out infinite}
        @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,0.4)}50%{opacity:.6;box-shadow:0 0 0 4px rgba(34,197,94,0)}}
        .nav-links{display:flex;gap:8px}
        .nav-link{font-size:10px;font-family:var(--font-mono);padding:4px 10px;border-radius:4px;color:var(--text-muted);text-decoration:none;border:1px solid var(--border);transition:all .15s}
        .nav-link:hover{color:var(--text-primary);border-color:var(--accent-blue);background:var(--blue-bg)}

        /* Layout */
        .ck-main{max-width:1700px;margin:0 auto;padding:16px 20px 8px}
        .ck-grid{display:grid;gap:14px}
        .g12{grid-template-columns:repeat(12,1fr)}

        /* Card */
        .card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
        .card-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)}
        .card-hdr h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary)}
        .card-body{padding:12px 14px}

        /* Badge */
        .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;font-family:var(--font-mono)}
        .badge-long{background:var(--green-bg);color:var(--accent-green);border:1px solid var(--green-bdr)}
        .badge-short{background:var(--red-bg);color:var(--accent-red);border:1px solid var(--red-bdr)}
        .badge-regime{background:var(--blue-bg);color:var(--accent-blue);border:1px solid var(--blue-bdr)}
        .badge-green{background:var(--green-bg);color:var(--accent-green)}
        .badge-amber{background:var(--amber-bg);color:var(--accent-amber)}
        .badge-red{background:var(--red-bg);color:var(--accent-red)}

        /* Table */
        table{width:100%;border-collapse:collapse}
        th{text-align:left;padding:6px 8px;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);border-bottom:1px solid var(--border);font-family:var(--font-mono)}
        td{padding:6px 8px;font-size:12px;border-bottom:1px solid var(--border-dim)}
        tr:hover td{background:var(--bg-hover)}

        /* Metric Box */
        .mbox{background:var(--bg-base);border-radius:6px;padding:10px 12px}
        .mbox .lbl{font-size:10px;font-weight:500;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;font-family:var(--font-mono);margin-bottom:4px}
        .mbox .val{font-size:18px;font-weight:700;font-family:var(--font-mono);line-height:1.1}
        .mbox .sub{font-size:10px;color:var(--text-muted);font-family:var(--font-mono);margin-top:2px}

        /* Risk bar */
        .rbar{height:5px;border-radius:3px;background:var(--bg-base);overflow:hidden;margin-top:4px}
        .rbar .fill{height:100%;border-radius:3px;transition:width .4s ease}

        /* Severity strip */
        .sev{border-left:3px solid var(--border);padding:6px 10px;margin-bottom:4px;border-radius:0 6px 6px 0;background:var(--bg-card-alt);transition:background .15s}
        .sev:hover{background:var(--bg-hover)}
        .sev-high{border-left-color:var(--accent-red)}
        .sev-medium{border-left-color:var(--accent-amber)}
        .sev-low{border-left-color:var(--accent-teal)}

        /* Conviction dots */
        .dots{display:inline-flex;gap:2px}
        .dots .on{color:var(--accent-blue);font-size:8px}
        .dots .off{color:var(--text-dim);font-size:8px;opacity:.3}

        /* Traffic light */
        .tl-green{color:var(--accent-green)}
        .tl-amber{color:var(--accent-amber)}
        .tl-red{color:var(--accent-red)}

        /* Utilities */
        .mono{font-family:var(--font-mono)}
        .tg{color:var(--accent-green)}.tr{color:var(--accent-red)}.ta{color:var(--accent-amber)}.tb{color:var(--accent-blue)}.tt{color:var(--accent-teal)}.tp{color:var(--accent-purple)}
        .tw{color:var(--text-primary)}.ts{color:var(--text-secondary)}.tm{color:var(--text-muted)}.td{color:var(--text-dim)}
        .tar{text-align:right}.tac{text-align:center}
        .fb{font-weight:700}.fm{font-weight:500}

        /* Footer */
        .ck-footer{border-top:1px solid var(--border);margin-top:14px;padding:10px 0}
        .ck-footer .inner{max-width:1700px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);font-family:var(--font-mono)}

        /* Span helpers */
        .c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}

        /* Loading */
        .loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text-muted)}
        .spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent-blue);border-radius:50%;animation:spin .8s linear infinite;margin-right:10px}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

/* ================================================================
   HELPERS
   ================================================================ */
const API = '';  // same origin
const fmt = (n, dp=0) => n != null ? Number(n).toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp}) : '--';
const fmtK = n => { if(n==null) return '--'; const v=Math.round(n/1000); return v>=0?'+$'+fmt(Math.abs(v))+'k':'-$'+fmt(Math.abs(v))+'k'; };
const fmtM = n => { if(n==null) return '--'; const v=n/1e6; return (v>=0?'+':'')+'$'+fmt(Math.abs(v),2)+'M'; };
const pnlCls = n => n>0?'tg':n<0?'tr':'ts';
const trunc = (s,n=80) => { const t=s||''; return t.length>n?t.substring(0,n)+'\u2026':t; };
const convDots = c => Array.from({length:5},(_,i) => <span key={i} className={i<c?'on':'off'}>{'\u25CF'}</span>);

async function fetchJSON(url) {
    try { const r = await fetch(API+url); if(!r.ok) throw new Error(r.status); return await r.json(); }
    catch(e) { console.error('Fetch:',url,e); return null; }
}

/* ================================================================
   COMPONENTS
   ================================================================ */

function Badge({type,children}) {
    return <span className={`badge badge-${type}`}>{children}</span>;
}

function MetricBox({label,value,sub,cls}) {
    return (
        <div className="mbox">
            <div className="lbl">{label}</div>
            <div className={`val ${cls||'tw'}`}>{value}</div>
            {sub && <div className="sub">{sub}</div>}
        </div>
    );
}

function RiskBar({current,limit,status}) {
    const pct = Math.min(Math.abs(current)/limit*100,100);
    const cls = status==='GREEN'?'tg':status==='AMBER'?'ta':'tr';
    return <div className="rbar"><div className="fill" style={{width:pct+'%',background:status==='GREEN'?'var(--accent-green)':status==='AMBER'?'var(--accent-amber)':'var(--accent-red)'}}></div></div>;
}

function TrafficDot({status}) {
    const cls = status==='GREEN'?'tl-green':status==='AMBER'?'tl-amber':'tl-red';
    return <span className={cls}>{'\u25CF'}</span>;
}

/* === REGIME PANEL === */
function RegimePanel({dispersion}) {
    if(!dispersion) return null;
    const regimeCls = dispersion.regime==='HIGH'?'badge-green':dispersion.regime==='LOW'?'badge-red':'badge-regime';
    return (
        <div className="card c12">
            <div className="card-hdr">
                <h2>Market Regime</h2>
                <Badge type={dispersion.regime==='HIGH'?'green':dispersion.regime==='LOW'?'red':'regime'}>{dispersion.regime} DISPERSION</Badge>
            </div>
            <div className="card-body" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:10}}>
                <MetricBox label="Dispersion CV" value={dispersion.universe_cv||'--'} sub={dispersion.regime_description} />
                <MetricBox label="Universe Mean" value={(dispersion.universe_mean||0)+'bp'} sub={`\u00B1${dispersion.universe_stdev||0}bp stdev`} />
                <MetricBox label="Pair Trade Sectors" value={(dispersion.pair_trade_sectors||[]).length}
                    sub={(dispersion.pair_trade_sectors||[]).slice(0,3).join(', ')||'None'} cls="tp" />
                <MetricBox label="Sector Dispersion" value={(dispersion.sectors||[]).filter(s=>s.regime==='HIGH').length+' HIGH'}
                    sub={`of ${(dispersion.sectors||[]).length} sectors`} cls="ta" />
            </div>
        </div>
    );
}

/* === TOP IDEAS PANEL === */
function TopIdeasPanel({screen}) {
    if(!screen) return null;
    const IdeaRow = ({n}) => (
        <tr>
            <td className="tw fm">{trunc(n.entity_name,26)}</td>
            <td className="tac"><span className="dots">{convDots(n.conviction)}</span></td>
            <td className="tar mono tw">{fmt(n.current_spread)}<span className="td">bp</span></td>
            <td className="tar mono ts">{fmt(n.fair_spread)}</td>
            <td className={`tar mono fm ${n.mispricing_bps>0?'tg':'tr'}`}>{n.mispricing_bps>0?'+':''}{fmt(n.mispricing_bps)}</td>
            <td className="tm" style={{fontSize:11}}>{trunc(n.thesis,50)}</td>
        </tr>
    );
    return (
        <div className="card c12">
            <div className="card-hdr">
                <h2>Top Ideas</h2>
                <div style={{display:'flex',gap:8}}><Badge type="long">Longs</Badge><Badge type="short">Shorts</Badge></div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr'}}>
                <div style={{borderRight:'1px solid var(--border)',padding:'10px 14px'}}>
                    <table><thead><tr><th style={{width:'28%'}}>Entity</th><th className="tac" style={{width:'10%'}}>Conv</th><th className="tar" style={{width:'12%'}}>Spread</th><th className="tar" style={{width:'10%'}}>Fair</th><th className="tar" style={{width:'12%'}}>Misprc</th><th style={{width:'28%'}}>Thesis</th></tr></thead>
                    <tbody>{(screen.top_longs||[]).map((n,i)=><IdeaRow key={i} n={n}/>)}</tbody></table>
                </div>
                <div style={{padding:'10px 14px'}}>
                    <table><thead><tr><th style={{width:'28%'}}>Entity</th><th className="tac" style={{width:'10%'}}>Conv</th><th className="tar" style={{width:'12%'}}>Spread</th><th className="tar" style={{width:'10%'}}>Fair</th><th className="tar" style={{width:'12%'}}>Misprc</th><th style={{width:'28%'}}>Thesis</th></tr></thead>
                    <tbody>{(screen.top_shorts||[]).map((n,i)=><IdeaRow key={i} n={n}/>)}</tbody></table>
                </div>
            </div>
        </div>
    );
}

/* === PORTFOLIO PANEL === */
function PortfolioPanel({portfolio}) {
    if(!portfolio||portfolio.error) return null;
    const risk = portfolio.risk_summary||{};
    const positions = portfolio.positions||[];
    return (
        <div className="card c8">
            <div className="card-hdr">
                <h2>Portfolio</h2>
                <div className="ck-stat">
                    NAV <strong>${portfolio.nav_millions||500}M</strong>
                    <span style={{margin:'0 6px'}}>|</span>
                    Gross <strong>{risk.gross_exposure_pct||0}%</strong>
                    <span style={{margin:'0 6px'}}>|</span>
                    Net <strong className={pnlCls(risk.net_exposure_pct||0)}>{risk.net_exposure_pct||0}%</strong>
                    <span style={{margin:'0 6px'}}>|</span>
                    Carry <strong className={pnlCls(risk.estimated_carry_bps||0)}>{risk.estimated_carry_bps||0}bp</strong>
                </div>
            </div>
            <div style={{overflowX:'auto'}}>
                <table>
                    <thead><tr><th>Entity</th><th className="tac">Dir</th><th className="tac">Conv</th><th className="tar">Size %</th><th className="tar">Notl $M</th><th className="tar">Spread</th><th className="tar">Fair</th><th>Sector</th><th className="tac">Rating</th></tr></thead>
                    <tbody>{positions.map((p,i) => (
                        <tr key={i}>
                            <td className="tw fm">{trunc(p.entity_name,28)}</td>
                            <td className="tac"><Badge type={p.direction==='SHORT_RISK'?'short':'long'}>{p.direction==='SHORT_RISK'?'Short':'Long'}</Badge></td>
                            <td className="tac"><span className="dots">{convDots(p.conviction)}</span></td>
                            <td className="tar mono ts">{p.size_pct}%</td>
                            <td className="tar mono tw">${p.notional_millions}M</td>
                            <td className="tar mono tw">{fmt(p.current_spread)}<span className="td">bp</span></td>
                            <td className="tar mono ts">{fmt(p.fair_spread)}</td>
                            <td className="ts" style={{fontSize:11}}>{p.sector||''}</td>
                            <td className="tac mono ts" style={{fontSize:11}}>{p.estimated_rating||''}</td>
                        </tr>
                    ))}</tbody>
                </table>
            </div>
        </div>
    );
}

/* === RISK PANEL === */
function RiskPanel({risk}) {
    if(!risk) return null;
    const sectorEntries = Object.entries(risk.sector_concentration||{});
    return (
        <div className="c4" style={{display:'flex',flexDirection:'column',gap:14}}>
            <div className="card" style={{flex:1}}>
                <div className="card-hdr"><h2>Risk Metrics</h2></div>
                <div className="card-body">
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                        <MetricBox label="Net DV01" value={`${risk.total_dv01>0?'+':''}$${fmt(risk.total_dv01)}`} cls={pnlCls(risk.total_dv01)} />
                        <MetricBox label="JTD Gross" value={`$${fmt(Math.round(risk.total_jtd_gross/1e6))}M`} sub={`${risk.jtd_pct_nav||0}% of NAV`} />
                        <MetricBox label="Gross Exp" value={`${risk.gross_exposure}%`} />
                        <MetricBox label="Net Exp" value={`${risk.net_exposure}%`} cls={pnlCls(risk.net_exposure)} />
                    </div>
                    {sectorEntries.length>0 && (
                        <div style={{marginTop:12}}>
                            <div className="mono td" style={{fontSize:10,marginBottom:6,textTransform:'uppercase',letterSpacing:'.4px'}}>Sector Concentration</div>
                            {sectorEntries.map(([k,v]) => {
                                const pct = Math.min(v*2,100);
                                const cls = v>25?'var(--accent-red)':v>20?'var(--accent-amber)':'var(--accent-blue)';
                                return (
                                    <div key={k} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'3px 0',fontSize:11}}>
                                        <span className="ts" style={{flex:'0 0 100px'}}>{k}</span>
                                        <span style={{flex:1,margin:'0 10px'}}><div className="rbar"><div className="fill" style={{width:pct+'%',background:cls}}></div></div></span>
                                        <span className="mono tw fm" style={{width:38,textAlign:'right'}}>{v}%</span>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            </div>
            <div className="card">
                <div className="card-hdr"><h2>Risk Limits</h2></div>
                <div className="card-body">
                    {(risk.risk_limits||[]).map((lim,i) => {
                        const val = typeof lim.current==='number'?(lim.unit==='$'?'$'+fmt(lim.current):fmt(lim.current,1)+'%'):String(lim.current);
                        const limVal = lim.unit==='$'?'$'+fmt(lim.limit):fmt(lim.limit)+'%';
                        return (
                            <div key={i} style={{padding:'6px 0',borderBottom:'1px solid var(--border-dim)'}}>
                                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>
                                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                                        <TrafficDot status={lim.status} />
                                        <span className="ts" style={{fontSize:12}}>{lim.metric}</span>
                                    </div>
                                    <div className="tar mono" style={{fontSize:12}}>
                                        <span className="tw fm">{val}</span>
                                        <span className="td" style={{marginLeft:4}}>/ {limVal}</span>
                                    </div>
                                </div>
                                <RiskBar current={lim.current} limit={lim.limit} status={lim.status} />
                            </div>
                        );
                    })}
                </div>
            </div>
        </div>
    );
}

/* === FILINGS PANEL === */
function FilingsPanel({filings}) {
    const data = filings||{filings:[],count:0};
    return (
        <div className="card c7">
            <div className="card-hdr">
                <h2>Filing Alerts</h2>
                <span className="mono td" style={{fontSize:10}}>{data.count} alerts</span>
            </div>
            <div className="card-body" style={{padding:'8px 10px',maxHeight:260,overflowY:'auto'}}>
                {(data.filings||[]).length===0 ? <div className="td" style={{padding:12,textAlign:'center'}}>No recent filings</div>
                : (data.filings||[]).map((f,i) => {
                    const sevCls = f.severity>=4?'sev-high':f.severity>=3?'sev-medium':'sev-low';
                    const impCls = f.credit_impact==='negative'?'badge-red':f.credit_impact==='positive'?'badge-green':'badge-amber';
                    return (
                        <div key={i} className={`sev ${sevCls}`}>
                            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                                <div style={{display:'flex',alignItems:'center',gap:6}}>
                                    <span className="tw fm" style={{fontSize:12}}>{f.matched_entity||f.company_name}</span>
                                    <Badge type={f.credit_impact==='negative'?'red':f.credit_impact==='positive'?'green':'amber'}>{f.credit_impact||'neutral'}</Badge>
                                </div>
                                <span className="mono td" style={{fontSize:10}}>{f.date}</span>
                            </div>
                            <div className="ts" style={{fontSize:11,marginTop:3}}>{trunc(f.credit_summary||f.headline,120)}</div>
                            <div className="mono td" style={{fontSize:9,marginTop:2}}>{f.source} &middot; sev {f.severity}/5</div>
                        </div>
                    );
                })}
            </div>
        </div>
    );
}

/* === RELATIVE VALUE PANEL === */
function RVPanel({rv}) {
    if(!rv||rv.error) return null;
    const RVName = ({n,type}) => {
        const cls = type==='cheap'?'tg':'tr';
        return (
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 0',borderBottom:'1px solid var(--border-dim)'}}>
                <div><span className="tw" style={{fontSize:12}}>{trunc(n.entity_name,22)}</span>
                    <span className="td" style={{fontSize:10,marginLeft:4}}>{n.sector}</span></div>
                <div className="mono tar" style={{fontSize:11}}>
                    <span className="ts">{fmt(n.spread)}bp</span>
                    <span className={`${cls} fb`} style={{marginLeft:6}}>{n.composite_score>0?'+':''}{n.composite_score}</span>
                </div>
            </div>
        );
    };
    return (
        <div className="card c5">
            <div className="card-hdr">
                <h2>Relative Value</h2>
                <div className="mono" style={{fontSize:10,display:'flex',gap:8}}>
                    <span className="tg">{rv.total_cheap||0} cheap</span>
                    <span className="td">&middot;</span>
                    <span className="ts">{rv.total_fair||0} fair</span>
                    <span className="td">&middot;</span>
                    <span className="tr">{rv.total_rich||0} rich</span>
                </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr'}}>
                <div style={{borderRight:'1px solid var(--border)',padding:'10px 14px'}}>
                    <div className="mono tg" style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:8}}>Cheapest</div>
                    {(rv.top_cheap||[]).map((n,i)=><RVName key={i} n={n} type="cheap"/>)}
                </div>
                <div style={{padding:'10px 14px'}}>
                    <div className="mono tr" style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:8}}>Richest</div>
                    {(rv.top_rich||[]).map((n,i)=><RVName key={i} n={n} type="rich"/>)}
                </div>
            </div>
        </div>
    );
}

/* === MATURITY WALL PANEL === */
function MaturityPanel({maturity}) {
    if(!maturity) return null;
    return (
        <div className="card c4">
            <div className="card-hdr"><h2>Maturity Wall &mdash; Refi Risk</h2></div>
            <div className="card-body">
                {(!maturity.entries||maturity.entries.length===0) ? <div className="td tac">No maturity data</div>
                : (maturity.entries||[]).map((e,i) => {
                    const risk = e.refi_risk||(e.risk_score>=7?'HIGH':e.risk_score>=4?'MEDIUM':'LOW');
                    const cls = risk==='HIGH'?'tr fb':risk==='MEDIUM'?'ta fm':'tg';
                    const spread = e.current_spread||e.spread||'';
                    return (
                        <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'5px 0',borderBottom:'1px solid var(--border-dim)'}}>
                            <span className="tw" style={{fontSize:12}}>{trunc(e.entity_name||e.company_name||'',24)}</span>
                            <div style={{display:'flex',alignItems:'center',gap:8}}>
                                {spread && <span className="mono ts" style={{fontSize:11}}>{fmt(spread)}bp</span>}
                                <span className={`mono ${cls}`} style={{fontSize:11}}>{risk}</span>
                            </div>
                        </div>
                    );
                })}
            </div>
        </div>
    );
}

/* === SCENARIOS PANEL === */
function ScenariosPanel({scenarios}) {
    if(!scenarios||scenarios.error) return null;
    return (
        <div className="card c8">
            <div className="card-hdr">
                <h2>Stress Scenarios</h2>
                <div className="mono td" style={{fontSize:10}}>
                    Worst: <span className="tr fb">{scenarios.worst_scenario}</span> &middot;
                    Best: <span className="tg fb">{scenarios.best_scenario}</span>
                </div>
            </div>
            <div style={{overflowX:'auto'}}>
                <table>
                    <thead><tr><th>Scenario</th><th className="tar">Portfolio</th><th className="tar">Hedges</th><th className="tar">Combined</th><th className="tar">% NAV</th><th>Worst Position</th></tr></thead>
                    <tbody>{(scenarios.scenarios||[]).map((s,i) => (
                        <tr key={i}>
                            <td className="tw">{s.name}</td>
                            <td className={`tar mono ${pnlCls(s.portfolio_pnl)}`}>{fmtK(s.portfolio_pnl)}</td>
                            <td className={`tar mono ${pnlCls(s.hedge_pnl)}`}>{fmtK(s.hedge_pnl)}</td>
                            <td className={`tar mono fb ${pnlCls(s.combined_pnl)}`}>{fmtK(s.combined_pnl)}</td>
                            <td className={`tar mono ${pnlCls(s.combined_pnl)}`}>{s.pct_nav>0?'+':''}{s.pct_nav}%</td>
                            <td className="tm" style={{fontSize:11}}>{trunc(s.worst_position,32)}</td>
                        </tr>
                    ))}</tbody>
                </table>
            </div>
        </div>
    );
}

/* ================================================================
   APP
   ================================================================ */
function App() {
    const [data, setData] = useState(null);
    const [loading, setLoading] = useState(true);
    const [lastUpdated, setLastUpdated] = useState('');

    const loadAll = useCallback(async () => {
        const [screen, portfolio, risk, filings, rv, maturity, dispersion, scenarios] = await Promise.all([
            fetchJSON('/api/screen'),
            fetchJSON('/api/portfolio'),
            fetchJSON('/api/risk'),
            fetchJSON('/api/filings'),
            fetchJSON('/api/rv'),
            fetchJSON('/api/maturity'),
            fetchJSON('/api/dispersion'),
            fetchJSON('/api/scenarios'),
        ]);
        setData({screen, portfolio, risk, filings, rv, maturity, dispersion, scenarios});
        setLoading(false);
        setLastUpdated(new Date().toLocaleTimeString('en-GB'));
    }, []);

    useEffect(() => {
        loadAll();
        const interval = setInterval(loadAll, 300000);
        return () => clearInterval(interval);
    }, [loadAll]);

    if (loading) return <div className="loading"><div className="spin"></div>Loading cockpit data...</div>;

    const d = data || {};
    const screen = d.screen;

    return (
        <>
            {/* HEADER */}
            <header className="ck-header">
                <div className="ck-brand">
                    <h1><em>Strategies</em> in Credit</h1>
                    <span className="sep">|</span>
                    <span className="sub">Cockpit</span>
                </div>
                <div className="ck-status">
                    <div className="nav-links">
                        <a href="/" className="nav-link">Dashboard</a>
                        <a href="/risk-calculator" className="nav-link">Risk Calc</a>
                    </div>
                    {d.dispersion && d.dispersion.regime &&
                        <Badge type={d.dispersion.regime==='HIGH'?'green':d.dispersion.regime==='LOW'?'red':'regime'}>
                            {d.dispersion.regime} DISPERSION
                        </Badge>
                    }
                    {screen && <span className="ck-stat">
                        <strong>{screen.count}</strong> names &middot;
                        <span className="tg"> {screen.long_count}L</span> /
                        <span className="tr"> {screen.short_count}S</span> &middot;
                        Conv <strong>{screen.avg_conviction}</strong> &middot;
                        Avg <strong>{fmt(screen.avg_spread)}bp</strong>
                    </span>}
                    <span className="ck-stat">{new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</span>
                    <div className="live-dot" title="Live"></div>
                </div>
            </header>

            {/* MAIN GRID */}
            <main className="ck-main">
                <div className="ck-grid g12">
                    {/* Row 1: Regime */}
                    <RegimePanel dispersion={d.dispersion} />

                    {/* Row 2: Top Ideas */}
                    <TopIdeasPanel screen={d.screen} />

                    {/* Row 3: Portfolio + Risk */}
                    <PortfolioPanel portfolio={d.portfolio} />
                    <RiskPanel risk={d.risk} />

                    {/* Row 4: Filings + RV */}
                    <FilingsPanel filings={d.filings} />
                    <RVPanel rv={d.rv} />

                    {/* Row 5: Maturity + Scenarios */}
                    <MaturityPanel maturity={d.maturity} />
                    <ScenariosPanel scenarios={d.scenarios} />
                </div>
            </main>

            {/* FOOTER */}
            <footer className="ck-footer">
                <div className="inner">
                    <span>Strategies in Credit v1.0 &mdash; iTraxx Xover S44 Cockpit</span>
                    <span>Updated {lastUpdated}</span>
                </div>
            </footer>
        </>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
